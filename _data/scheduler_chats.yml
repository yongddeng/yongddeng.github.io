  ask: "What’s the difference between TCP and UDP?"
  answer:
    - "Both are transport protocols⟨ that run⟩ on top of IP, but they make different promises."
    - "\n\nTCP is connection-oriented: it sets up a connection with a⟨ three-way⟩ handshake, numbers every byte, retransmits anything that’s lost, delivers data in order, and slows down when the network is congested."
    - " That makes it reliable but adds⟨ some⟩ latency, which is why it’s used for the web, email and file transfers."
    - "\n\nUDP just sends individual datagrams⟨ to an address⟩, with no connection, no retransmission and no guarantee of order."
    - [" Packets can arrive out of order, twice or not at all, and it’s up to the application to cope."]
    - " In exchange it has very little overhead, so it suits real-time traffic like voice calls, video and games⟨, as well as short exchanges like DNS lookups⟩."
    - ["\n\nQUIC, which HTTP/3 uses, is built on UDP and adds its own reliability and encryption on top."]
