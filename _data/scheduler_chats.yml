    - " The line just above the error in the traceback shows⟨ you⟩ where, something like row['user_id'] or data['user_id']."
    - "\n\nA few⟨ common⟩ causes⟨ to check⟩:"
    - "\n1. The data comes from an API or a file where the field is⟨ named or⟩ spelt differently, such as 'userId' or 'user-id'."
    - "\n2. Some records simply don’t have that field, so the first few⟨ rows⟩ work and a later one fails."
    - ["\n3. The key has stray whitespace or different capitalisation, for example 'user_id ' read from a CSV header."]
    - "\n\nTo find out which⟨ one it is⟩, print the dictionary’s keys just before the failing line: print(row.keys())."
    - " If the field is genuinely optional, use row.get('user_id'), which returns None instead of raising⟨ an error⟩, or row.get('user_id', default) to supply a fallback."
    - [" If it should always be there, it’s better to let the error surface and fix the data at its source."]
