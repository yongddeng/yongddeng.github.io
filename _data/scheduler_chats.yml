- lang: en
  ask: "Explain how HTTPS works, step by step."
  answer:
    - "HTTPS is ordinary HTTP sent through an encrypted TLS connection, so that nobody between you and the server can read or alter what you send⟨ or receive⟩."
    - " Here’s what happens when you open an https:// address, using TLS 1.3, the current version."
    - "\n\n1. Your browser opens a TCP connection to the server, on port 443⟨ by default⟩."
    - "\n\n2. It sends a ClientHello⟨ message⟩: the TLS versions and cipher suites it supports, a random value, and a key share, which is its half of a Diffie–Hellman key exchange."
    - "\n\n3. The server replies with a ServerHello⟨ message⟩ containing its own key share⟨ and its choice of cipher suite⟩."
    - " From the two key shares both sides can now compute the same shared secret, which an eavesdropper who saw only the shares cannot."
    - [" Everything after this point is encrypted."]
    - "\n\n4. The server sends its certificate, which binds its domain name to a public key and is signed by a⟨ trusted⟩ certificate authority, along with a signature over the handshake made with the matching private key."
    - "\n\n5. Your browser checks the certificate: that it was issued for this domain, that it hasn’t expired, and that its chain of signatures leads to a root certificate the browser or operating system already trusts."
    - " It then checks the server’s signature, which proves the server really holds the private key."
    - "\n\n6. Both sides exchange Finished messages, confirming that neither⟨ side⟩ saw a tampered handshake."
    - "\n\n7. From then on, HTTP requests and responses travel inside the encrypted connection, protected by symmetric encryption such as AES-GCM or ChaCha20-Poly1305, which is fast enough for bulk data⟨ like pages and video⟩."
    - ["\n\nThe Diffie–Hellman exchange also gives forward secrecy: even if the server’s private key is stolen later, recorded past sessions can’t be decrypted, because their keys were never sent over the network."]
