# scheduler.exe's chats (assets/js/scheduler.js): what its users send and what
# comes back. A chat is a lang (one of scheduler.js's LANGS), an ask, and its
# answer in pieces: a piece is said at any length, a piece in a list of its own
# (["…"]) only when the answer's length wants it, and words in ⟨…⟩ may be left
# out of either, so that an answer comes to the engine's count in its own
# words. A chat with make (a key of scheduler.js's MAKERS) names its own size
# in its ask, in the sizes its rule gives ({n}, its count, unless the rule
# gives others, as leap's {a} and {b}), and has "{items}" among its pieces,
# where as many items go as fit, each made by the rule. paste names what a
# prompt longer than its ask carried, else the rest is the chat so far.
# Checked as the site builds by _plugins/check_scheduler.rb

# English, answered in prose
- lang: en
  ask: "What’s the difference between a list and a tuple in Python?"
  answer:
    - "The⟨ main⟩ difference is that lists are mutable and tuples are immutable."
    - " You can append to, remove from or reassign items in a list⟨ at any time⟩, but once a tuple is created its contents can’t⟨ ever⟩ change."
    - [" Because tuples are immutable, they can be used as dictionary keys or stored in a set, as long as everything inside them is hashable too. Lists can’t, since their hash would change whenever they did."]
    - "\n\nIn practice, use a list for a collection of similar items that grows or shrinks, like the lines of a file⟨ or the rows of a query⟩, and a tuple for a fixed record whose positions mean something, like⟨ a point’s⟩ (latitude, longitude)."
    - [" Tuples are also⟨ slightly⟩ smaller in memory and a little faster to create, though that rarely matters."]
    - ["\n\nOne gotcha: a tuple with a single item needs a trailing comma, so (5,) is a tuple while (5) is just the integer 5."]
    - ["\n\nNote that a tuple holding a list can still have that list changed, since the tuple only fixes which objects it holds, not what’s inside them."]
