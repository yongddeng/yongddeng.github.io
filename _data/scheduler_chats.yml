  ask: "What does this function do, and is there a bug?"
  paste: "a Python function, binary_search(items, target)"
  answer:
    - "This is a binary search."
    - " It looks for target in a sorted list by keeping two indices, low and high, checking the middle element⟨ between them⟩, and throwing away the half that can’t contain the target, so it needs at most about log₂(n) comparisons."
    - "\n\nThe⟨ most⟩ common bug in this pattern is in the loop condition or the⟨ index⟩ updates."
    - " If high starts at len(items) - 1, the loop has to be while low <= high⟨, not low < high⟩, or the last remaining element is never checked."
    - " Likewise the updates must be low = mid + 1 and high = mid - 1, because setting low = mid can loop forever once low and high are next to each other."
    - ["\n\nAlso make sure the list is sorted⟨ in ascending order⟩ before calling it, because binary search silently gives wrong answers on unsorted input."]
    - ["\n\nIn Python you could use the standard bisect module instead: bisect.bisect_left(items, target) gives the insertion point, and the target is present if that index is in range and items[index] == target."]
