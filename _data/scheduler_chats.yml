  ask: "Can you explain what a hash table is, simply?"
  answer:
    - "A hash table stores key–value pairs so that you can⟨ quickly⟩ find a value by its key in roughly constant time⟨, however many pairs it holds⟩."
    - " It keeps an⟨ internal⟩ array of slots, often called buckets."
    - " To store a pair, it runs the key through a hash function, which turns the key into a⟨ fixed-size⟩ number, and uses that number, modulo the array’s size, to pick a bucket."
    - " To look a key up, it hashes the key again and goes straight to the same bucket instead of searching⟨ through⟩ the whole collection."
    - "\n\nTwo different keys can⟨ sometimes⟩ land in the same bucket, which is called a collision."
    - " Hash tables handle collisions either by keeping a short list in each bucket, called chaining, or by probing for the next free slot⟨ in the array⟩, called open addressing."
    - ["\n\nAs the table fills up, collisions become more common, so most implementations grow the array, usually doubling it, and rehash everything once it passes a load factor such as 0.75⟨, the share of slots in use⟩. That occasional resize costs O(n), but averaged over many insertions each one is still O(1)."]
    - ["\n\nPython’s dict and Java’s HashMap are both hash tables⟨ under the hood⟩."]
