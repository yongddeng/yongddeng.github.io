papers:
  - { id: lstm, name: "LSTM", year: 1997, venue: "Neural Computation", shelf: arch, sub: seq, builds_on: [],
      title: "Long Short-Term Memory",
      note: "Gated memory cells that let gradients survive long sequences. The recurrent workhorse until attention." }
  - { id: alexnet, name: "AlexNet", year: 2012, venue: "NeurIPS", shelf: vision, sub: cnn, builds_on: [],
      title: "ImageNet Classification with Deep Convolutional Neural Networks",
      note: "A GPU-trained deep conv net wins ImageNet by a wide margin. ReLU, dropout and data augmentation become standard." }
  - { id: word2vec, name: "word2vec", year: 2013, venue: "NeurIPS", shelf: embed, sub: wv, builds_on: [],
      title: "Distributed Representations of Words and Phrases and their Compositionality",
      note: "Skip-gram with negative sampling. Dense word vectors whose arithmetic captures analogies." }
  - { id: glove, name: "GloVe", year: 2014, venue: "EMNLP", shelf: embed, sub: wv, builds_on: [word2vec],
      title: "GloVe: Global Vectors for Word Representation",
      note: "Word vectors fitted to the log of global co-occurrence counts; a bridge between count-based and predictive methods." }
  - { id: seq2seq, name: "seq2seq", year: 2014, venue: "NeurIPS", shelf: arch, sub: seq, builds_on: [lstm],
      title: "Sequence to Sequence Learning with Neural Networks",
      note: "An LSTM encoder compresses the source into one vector that an LSTM decoder unrolls. The bottleneck attention was invented to fix." }
  - { id: dropout, name: "Dropout", year: 2014, venue: "JMLR", shelf: pre, sub: reg, builds_on: [],
      title: "Dropout: A Simple Way to Prevent Neural Networks from Overfitting",
      note: "Randomly zero units during training; an implicit ensemble of thinned networks." }
  - { id: gan, name: "GAN", year: 2014, venue: "NeurIPS", shelf: vision, sub: gen, builds_on: [],
      title: "Generative Adversarial Nets",
      note: "A generator and a discriminator trained as a minimax game. Sharp samples, unstable training." }
  - { id: vae, name: "VAE", year: 2014, venue: "ICLR", shelf: vision, sub: gen, builds_on: [],
      title: "Auto-Encoding Variational Bayes",
      note: "The reparameterisation trick makes a latent-variable model trainable by backprop through the ELBO." }
  - { id: vgg, name: "VGG", year: 2015, venue: "ICLR", shelf: vision, sub: cnn, builds_on: [alexnet],
      title: "Very Deep Convolutional Networks for Large-Scale Image Recognition",
      note: "Stacks of 3×3 convolutions, 16 to 19 layers deep. Depth matters, and the plain design made it the default backbone." }
  - { id: batchnorm, name: "BatchNorm", year: 2015, venue: "ICML", shelf: pre, sub: reg, builds_on: [],
      title: "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift",
      note: "Normalise each activation over the mini-batch. Faster training and higher learning rates; the stated reason was later disputed." }
  - { id: adam, name: "Adam", year: 2015, venue: "ICLR", shelf: pre, sub: opt, builds_on: [],
      title: "Adam: A Method for Stochastic Optimization",
      note: "Per-parameter step sizes from bias-corrected first and second moment estimates. The default optimiser since." }
  - { id: distill, name: "Distillation", year: 2015, venue: "arXiv", shelf: sys, sub: quant, builds_on: [],
      title: "Distilling the Knowledge in a Neural Network",
      note: "Train a small model on a big model's softened outputs. The teacher–student recipe behind every distilled LLM." }
  - { id: resnet, name: "ResNet", year: 2016, venue: "CVPR", shelf: vision, sub: cnn, builds_on: [vgg, batchnorm],
      title: "Deep Residual Learning for Image Recognition",
      note: "Skip connections let networks of 100+ layers train. The residual stream every Transformer block inherits." }
  - { id: bahdanau, name: "Bahdanau attention", year: 2015, venue: "ICLR", shelf: arch, sub: seq, builds_on: [seq2seq],
      title: "Neural Machine Translation by Jointly Learning to Align and Translate",
      note: "Soft alignment over encoder states while decoding. The attention mechanism before the Transformer." }
  - { id: luong, name: "Luong attention", year: 2015, venue: "EMNLP", shelf: arch, sub: seq, builds_on: [bahdanau],
      title: "Effective Approaches to Attention-based Neural Machine Translation",
      note: "Global vs local attention, and the dot-product score the Transformer later adopts." }
  - { id: transformer, name: "Transformer", year: 2017, venue: "NeurIPS", shelf: arch, sub: block, builds_on: [luong],
      title: "Attention Is All You Need",
      note: "Drops recurrence for multi-head self-attention. The base class of nearly everything after it." }
  - { id: layernorm, name: "Pre-LN", year: 2020, venue: "ICML", shelf: arch, sub: block, builds_on: [transformer, ln],
      title: "On Layer Normalization in the Transformer Architecture",
      note: "Putting LayerNorm before the residual branch tames gradients at init and removes the warm-up requirement." }
  - { id: ln, name: "LayerNorm", year: 2016, venue: "arXiv", shelf: arch, sub: block, builds_on: [batchnorm],
      title: "Layer Normalization",
      note: "Normalise over the features of one example rather than over the batch, so it works for sequences and at batch size one." }
  - { id: gelu, name: "GELU", year: 2016, venue: "arXiv", shelf: arch, sub: block, builds_on: [],
      title: "Gaussian Error Linear Units (GELUs)",
      note: "x·Φ(x): a smooth gate that weights inputs by their value rather than their sign. The activation of BERT and GPT." }
  - { id: rmsnorm, name: "RMSNorm", year: 2019, venue: "NeurIPS", shelf: arch, sub: block, builds_on: [ln],
      title: "Root Mean Square Layer Normalization",
      note: "Drops the mean-centring from LayerNorm and rescales by the RMS alone; cheaper and just as good. The norm in LLaMA and its descendants." }
  - { id: swiglu, name: "SwiGLU", year: 2020, venue: "arXiv", shelf: arch, sub: block, builds_on: [transformer, gelu],
      title: "GLU Variants Improve Transformer",
      note: "A gated feed-forward layer, Swish(xW)⊙xV, beats ReLU and GELU at equal compute. The FFN in PaLM, LLaMA and most models since." }
  - { id: qknorm, name: "QK-norm", year: 2020, venue: "EMNLP", shelf: arch, sub: block, builds_on: [ln, transformer],
      title: "Query-Key Normalization for Transformers",
      note: "L2-normalise queries and keys before the dot product so attention logits cannot blow up. Revived in Gemma 3 and OLMo 2 for training stability." }
  - { id: mqa, name: "Multi-query attention", year: 2019, venue: "arXiv", shelf: arch, sub: attn, builds_on: [transformer],
      title: "Fast Transformer Decoding: One Write-Head is All You Need",
      note: "All heads share one key and one value projection, shrinking the KV cache by the head count. GQA later interpolates between this and full MHA." }
  - { id: linattn, name: "Linear attention", year: 2020, venue: "ICML", shelf: arch, sub: attn, builds_on: [transformer],
      title: "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention",
      note: "Replace softmax with a feature-map kernel so attention becomes a running sum: linear in length and expressible as an RNN." }
  - { id: relpos, name: "Relative position", year: 2018, venue: "NAACL", shelf: arch, sub: pos, builds_on: [transformer],
      title: "Self-Attention with Relative Position Representations",
      note: "Encodes pairwise offsets inside the attention score instead of adding absolute positions." }
  - { id: txl, name: "Transformer-XL", year: 2019, venue: "ACL", shelf: arch, sub: pos, builds_on: [transformer, relpos],
      title: "Transformer-XL: Attentive Language Models Beyond a Fixed-Length Context",
      note: "Segment-level recurrence with relative positions for context beyond one window." }
  - { id: poslen, name: "PE & length generalisation", year: 2023, venue: "NeurIPS", shelf: arch, sub: pos, builds_on: [relpos],
      title: "The Impact of Positional Encoding on Length Generalization in Transformers",
      note: "In decoder-only models, no positional encoding generalises to longer inputs better than most explicit schemes." }
  - { id: rope, name: "RoPE", year: 2021, venue: "arXiv", shelf: arch, sub: pos, builds_on: [transformer, relpos],
      title: "RoFormer: Enhanced Transformer with Rotary Position Embedding",
      note: "Rotate query and key by an angle proportional to position, so the dot product depends only on the relative offset. The default in decoder LMs." }
  - { id: alibi, name: "ALiBi", year: 2022, venue: "ICLR", shelf: arch, sub: pos, builds_on: [transformer, relpos],
      title: "Train Short, Test Long: Attention with Linear Biases Enables Input Length Extrapolation",
      note: "No position embedding at all; subtract a distance-proportional penalty from the attention scores. Extrapolates past the training length." }
  - { id: rffu, name: "RFF analysis", year: 2019, venue: "ICML", shelf: arch, sub: attn, builds_on: [],
      title: "Towards a Unified Analysis of Random Fourier Features",
      note: "Sample complexity of random Fourier features for kernel ridge regression and SVMs." }
  - { id: performer, name: "Performer", year: 2021, venue: "ICLR", shelf: arch, sub: attn, builds_on: [transformer, rffu, linattn],
      title: "Rethinking Attention with Performers",
      note: "Linear-time attention by approximating the softmax kernel with positive random features (FAVOR+)." }
  - { id: heads, name: "Pruning heads", year: 2019, venue: "ACL", shelf: arch, sub: interp, builds_on: [transformer],
      title: "Analyzing Multi-Head Self-Attention: Specialized Heads Do the Heavy Lifting, the Rest Can Be Pruned",
      note: "A few positional and syntactic heads carry the model; most of the rest can be pruned without loss." }
  - { id: bertlook, name: "What BERT looks at", year: 2019, venue: "BlackboxNLP", shelf: arch, sub: interp, builds_on: [bert],
      title: "What Does BERT Look At? An Analysis of BERT’s Attention",
      note: "Attention heads track syntax and coreference; attention as a window into what was learned." }
  - { id: mamba, name: "Mamba", year: 2023, venue: "arXiv", shelf: arch, sub: attn, builds_on: [transformer],
      title: "Mamba: Linear-Time Sequence Modeling with Selective State Spaces",
      note: "Input-dependent state-space recurrence as a sub-quadratic alternative to attention." }
  - { id: bpe, name: "BPE", year: 2016, venue: "ACL", shelf: pre, sub: tok, builds_on: [],
      title: "Neural Machine Translation of Rare Words with Subword Units",
      note: "Byte-pair merges give an open vocabulary of subwords. Still the default tokeniser." }
  - { id: subreg, name: "Subword regularisation", year: 2018, venue: "ACL", shelf: pre, sub: tok, builds_on: [bpe],
      title: "Subword Regularization: Improving Neural Network Translation Models with Multiple Subword Candidates",
      note: "Sample segmentations from a unigram LM at training time, as regularisation." }
  - { id: spm, name: "SentencePiece", year: 2018, venue: "EMNLP", shelf: pre, sub: tok, builds_on: [bpe, subreg],
      title: "SentencePiece: A Simple and Language Independent Subword Tokenizer and Detokenizer for Neural Text Processing",
      note: "Language-agnostic tokeniser trained from raw text; BPE and unigram in one tool." }
  - { id: ulmfit, name: "ULMFiT", year: 2018, venue: "ACL", shelf: lm, sub: enc, builds_on: [lstm],
      title: "Universal Language Model Fine-tuning for Text Classification",
      note: "Pretrain an LSTM language model, then fine-tune discriminatively. Transfer learning for NLP before BERT." }
  - { id: bert, name: "BERT", year: 2019, venue: "NAACL", shelf: lm, sub: enc, builds_on: [transformer, ulmfit, gpt1],
      title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding",
      note: "Masked LM plus next-sentence prediction; a bidirectional encoder you fine-tune per task." }
  - { id: roberta, name: "RoBERTa", year: 2019, venue: "arXiv", shelf: lm, sub: enc, builds_on: [bert],
      title: "RoBERTa: A Robustly Optimized BERT Pretraining Approach",
      note: "Drop NSP, train longer on more data with dynamic masking. BERT was undertrained." }
  - { id: xlnet, name: "XLNet", year: 2019, venue: "NeurIPS", shelf: lm, sub: enc, builds_on: [bert, txl],
      title: "XLNet: Generalized Autoregressive Pretraining for Language Understanding",
      note: "Permutation language modelling over Transformer-XL; no [MASK] train/test mismatch." }
  - { id: gpt1, name: "GPT-1", year: 2018, venue: "OpenAI report", shelf: lm, sub: gpt, builds_on: [transformer],
      title: "Improving Language Understanding by Generative Pre-Training",
      note: "Pretrain a decoder on text, then fine-tune per task. The first of the GPT series and BERT's foil." }
  - { id: gpt2, name: "GPT-2", year: 2019, venue: "OpenAI report", shelf: lm, sub: gpt, builds_on: [transformer, bpe, gpt1],
      title: "Language Models are Unsupervised Multitask Learners",
      note: "Decoder-only LM at 1.5B parameters; zero-shot task transfer appears with scale." }
  - { id: gpt3, name: "GPT-3", year: 2020, venue: "NeurIPS", shelf: lm, sub: gpt, builds_on: [gpt2],
      title: "Language Models are Few-Shot Learners",
      note: "175B parameters; in-context few-shot learning with no gradient updates." }
  - { id: llama, name: "LLaMA", year: 2023, venue: "arXiv", shelf: lm, sub: open, builds_on: [chinchilla, gpt3, rmsnorm, swiglu, rope],
      title: "LLaMA: Open and Efficient Foundation Language Models",
      note: "7B to 65B open weights trained on public data well past the Chinchilla-optimal token count." }
  - { id: mistral, name: "Mistral 7B", year: 2023, venue: "arXiv", shelf: lm, sub: open, builds_on: [llama, gqa],
      title: "Mistral 7B",
      note: "Sliding-window attention with a rolling KV buffer plus GQA; a 7B model that beats Llama 2 13B. Mixtral is this with experts." }
  - { id: llama3, name: "Llama 3", year: 2024, venue: "arXiv", shelf: lm, sub: open, builds_on: [llama],
      title: "The Llama 3 Herd of Models",
      note: "Dense 8B to 405B models on 15T tokens, with a full account of data, scaling and post-training. The open reference point of 2024." }
  - { id: dsv2, name: "DeepSeek-V2", year: 2024, venue: "arXiv", shelf: lm, sub: open, builds_on: [llama, mixtral, dsmoe],
      title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model",
      note: "Multi-head latent attention compresses the KV cache; fine-grained MoE with shared experts. The architecture V3 and R1 run on." }
  - { id: dsv3, name: "DeepSeek-V3", year: 2024, venue: "arXiv", shelf: lm, sub: open, builds_on: [dsv2],
      title: "DeepSeek-V3 Technical Report",
      note: "671B-parameter MoE (37B active) trained in FP8 for a reported 2.8M GPU-hours, with auxiliary-loss-free load balancing and multi-token prediction." }
  - { id: qwen25, name: "Qwen2.5", year: 2024, venue: "arXiv", shelf: lm, sub: open, builds_on: [llama],
      title: "Qwen2.5 Technical Report",
      note: "0.5B to 72B dense models on 18T tokens, plus the widely used open coder and math variants." }
  - { id: qwen3, name: "Qwen3", year: 2025, venue: "arXiv", shelf: lm, sub: open, builds_on: [qwen25, r1, distill],
      title: "Qwen3 Technical Report",
      note: "Dense and MoE models with a switchable thinking mode, so one checkpoint serves both quick answers and long reasoning." }
  - { id: t5, name: "T5", year: 2020, venue: "JMLR", shelf: lm, sub: s2s, builds_on: [bert],
      title: "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer",
      note: "Every task as text-to-text; a systematic study of pretraining choices at scale." }
  - { id: bart, name: "BART", year: 2020, venue: "ACL", shelf: lm, sub: s2s, builds_on: [bert, gpt2],
      title: "BART: Denoising Sequence-to-Sequence Pre-training for Natural Language Generation, Translation, and Comprehension",
      note: "Corrupt text, reconstruct it with an encoder-decoder. Strong for generation and summarisation." }
  - { id: chinchilla, name: "Chinchilla", year: 2022, venue: "NeurIPS", shelf: pre, sub: laws, builds_on: [gpt3, kaplan],
      title: "Training Compute-Optimal Large Language Models",
      note: "Scale tokens with parameters, about 20 tokens per parameter. Gopher and GPT-3 were undertrained." }
  - { id: kaplan, name: "Scaling laws", year: 2020, venue: "arXiv", shelf: pre, sub: laws, builds_on: [gpt2],
      title: "Scaling Laws for Neural Language Models",
      note: "Loss falls as a power law in parameters, data and compute, and larger models are more sample-efficient. Chinchilla later corrects the data exponent." }
  - { id: flan, name: "FLAN", year: 2022, venue: "ICLR", shelf: post, sub: sft, builds_on: [gpt3, t5],
      title: "Finetuned Language Models Are Zero-Shot Learners",
      note: "Instruction tuning on many tasks improves zero-shot performance on unseen ones." }
  - { id: instructgpt, name: "InstructGPT", year: 2022, venue: "NeurIPS", shelf: post, sub: sft, builds_on: [gpt3],
      title: "Training Language Models to Follow Instructions with Human Feedback",
      note: "SFT, then a reward model, then PPO (RLHF). A 1.3B model preferred over 175B GPT-3." }
  - { id: r1, name: "DeepSeek-R1", year: 2025, venue: "arXiv", shelf: post, sub: sft, builds_on: [instructgpt, cot, dsv3, distill],
      title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning",
      note: "RL with verifiable rewards (GRPO) elicits long chain-of-thought without SFT; then distilled into small models." }
  - { id: selfcons, name: "Self-consistency", year: 2023, venue: "ICLR", shelf: tt, sub: tts, builds_on: [cot],
      title: "Self-Consistency Improves Chain of Thought Reasoning in Language Models",
      note: "Sample several chains and take the majority answer. The first test-time compute knob, years before o1." }
  - { id: ttc, name: "Test-time compute", year: 2024, venue: "arXiv", shelf: tt, sub: tts, builds_on: [cot, chinchilla, selfcons],
      title: "Scaling LLM Test-Time Compute Optimally Can Be More Effective than Scaling Model Parameters",
      note: "Allocate inference compute (verifier search, revisions) per prompt difficulty; beats a 14× larger model on easy and medium prompts." }
  - { id: flash, name: "FlashAttention", year: 2022, venue: "NeurIPS", shelf: sys, sub: serve, builds_on: [transformer],
