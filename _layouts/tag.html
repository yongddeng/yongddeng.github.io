---
layout: default
---
<ul>
	{% for post in site.tags[page.tag] %}
		<li><a href="{{  post.url }}?tag={{ page.tag | slugify }}" title="{{ post.title }}"><img src="/assets/img/{{ post.icon | default: 'notepad.png' }}" title="{{ post.title }}" /><span>{{ post.title }}</span></a></li>
	{% endfor %}
</ul>
