{%- capture size %}{% include post-size.html post=include.post %}{% endcapture -%}
<li><a href="{{ include.post.url }}" title="{{ include.post.title }}"><img src="/assets/img/{{ include.post.icon | default: 'notepad-32.png' }}" title="{{ include.post.title }}" /><span class="nm">{{ include.post.title }}</span><span class="sz">{{ size }}</span><span class="ty">{{ site.data.types[include.post.icon] | default: 'Notepad' }}</span><span class="dt">{{ include.post.date | date: "%F" }}</span></a></li>
