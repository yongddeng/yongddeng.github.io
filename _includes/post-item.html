{%- capture size %}{% include post-size.html post=include.post %}{% endcapture -%}
<li data-date="{{ include.post.date | date: '%Y%m%d' }}" data-size="{{ size }}"><a href="{{ include.post.url }}{% if include.tag %}?tag={{ include.tag | slugify }}{% endif %}" title="{{ include.post.title }}"><img src="/assets/img/{{ include.post.icon | default: 'notepad.png' }}" title="{{ include.post.title }}" /><span class="nm">{{ include.post.title }}</span><span class="sz">{{ size }}</span><span class="ty">{% if include.post.icon == 'video.svg' %}Media Clip{% else %}Notepad{% endif %}</span><span class="dt">{{ include.post.date | date: "%-d/%-m/%y" }}</span></a></li>
