permalink: /:year:month:day/:title
url: https://yongddeng.github.io
#baseurl: /project

# variables
name: Hikikomori # Your Site Name
description: Notes on mathematics and computer science.
cloudflare_analytics_token: d39f12a22c66442389e654cf251872e5

# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE"]

# The programs on (D:) in My Computer, each a window of its own
collections:
  programs:
    output: true
    permalink: /d/:name
defaults:
  - scope:
      type: programs
    values:
      layout: default
      winclass: exe-win
      no_comment: true

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable : true